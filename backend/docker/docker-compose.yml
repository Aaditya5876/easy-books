services:
  postgres:
    image: postgres:16-alpine
    container_name: easybooks-postgres
    environment:
      POSTGRES_USER: easybooksuser
      POSTGRES_PASSWORD: easybookspass
      POSTGRES_DB: easybooks
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U easybooksuser -d easybooks']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: easybooks-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    container_name: easybooks-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://easybooksuser:easybookspass@postgres:5432/easybooks
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # No insecure fallback defaults — deploy-time env vars are required.
      # (JWT_SECRET signs parent/student portal tokens; JWT_ACCESS/REFRESH_SECRET
      # sign staff tokens. All three must be set to real random values before
      # `docker compose up`, e.g. via a deploy-time .env file next to this one.)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set to the real frontend domain}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
